name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-verify:
    name: Build + Test + Plugin Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v2

      - name: Build, unit tests, integration tests, determinism gates, plugin verification
        run: ./gradlew --no-daemon ci
