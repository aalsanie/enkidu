name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify immutable action pins
        run: python3 .github/scripts/verify-action-pins.py

  build-and-test:
    name: Build and test (${{ matrix.os }})
    needs:
      - workflow-security
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Java 17 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          set-default: false
          verify-signature: true

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Verify formatting, compilation, tests, packaging, and determinism
        if: runner.os != 'Windows'
        run: >
          ./gradlew
          --no-daemon
          --stacktrace
          spotlessCheckAll
          checkAll
          assembleAll
          verifyNoWorkingTreeChanges

      - name: Verify formatting, compilation, tests, packaging, and determinism
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          .\gradlew.bat
          --no-daemon
          --stacktrace
          spotlessCheckAll
          checkAll
          assembleAll
          verifyNoWorkingTreeChanges

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7

  plugin-verification:
    name: IntelliJ plugin verification
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Java 17 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          set-default: false
          verify-signature: true

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify plugin structure and IDE compatibility
        run: >
          ./gradlew
          --no-daemon
          --stacktrace
          :enkidu-intellij-plugin:pluginVerification

      - name: Upload plugin verification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-verification-reports
          path: |
            enkidu-intellij-plugin/build/reports/
            enkidu-intellij-plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7

  pit-project:
    name: End-to-end linkage scenarios
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Java 17 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          set-default: false
          verify-signature: true

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/verify-pit-project.sh

      - name: Run controlled linkage scenarios
        run: .github/scripts/verify-pit-project.sh

      - name: Upload linkage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pit-project-reports
          path: docs/enkidu_pit_project/build/enkidu/ci/
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    needs:
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  required:
    name: Required PR gate
    if: always()
    needs:
      - workflow-security
      - build-and-test
      - plugin-verification
      - pit-project
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs passed
        shell: bash
        env:
          WORKFLOW_SECURITY: ${{ needs.workflow-security.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          PLUGIN_VERIFICATION: ${{ needs.plugin-verification.result }}
          PIT_PROJECT: ${{ needs.pit-project.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail

          declare -A required_results=(
            ["Workflow security"]="$WORKFLOW_SECURITY"
            ["Build and test"]="$BUILD_AND_TEST"
            ["Plugin verification"]="$PLUGIN_VERIFICATION"
            ["Pit project"]="$PIT_PROJECT"
          )

          for name in "${!required_results[@]}"; do
            result="${required_results[$name]}"
            if [[ "$result" != "success" ]]; then
              echo "$name result: $result"
              exit 1
            fi
          done

          if [[ "$DEPENDENCY_REVIEW" != "success" && "$DEPENDENCY_REVIEW" != "skipped" ]]; then
            echo "Dependency review result: $DEPENDENCY_REVIEW"
            exit 1
          fi
