name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Tests + determinism + plugin verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check repository checkout
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          test -f ./gradlew || { echo "::error::Missing ./gradlew in repo root (must be committed)"; exit 1; }
          chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v2

      - name: Run CI task
        run: ./gradlew --no-daemon ci
