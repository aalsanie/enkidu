name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v2

      - name: Verify tag matches Gradle version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(./gradlew -q printVersion)"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag (${TAG}) must match version in Gradle (${VERSION})."
            exit 1
          fi

      - name: Build, test, plugin verification
        run: ./gradlew --no-daemon ci

      - name: Build plugin ZIP
        run: ./gradlew --no-daemon :enkidu-intellij-plugin:buildPlugin

      - name: Build CLI distribution
        run: ./gradlew --no-daemon :enkidu-cli:installDist

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -v enkidu-intellij-plugin/build/distributions/*.zip dist/ || true
          tar -C enkidu-cli/build/install -czf dist/enkidu-cli-${GITHUB_REF_NAME}.tar.gz enkidu-cli || true
          (cd dist && sha256sum * > SHA256SUMS.txt) || true
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
