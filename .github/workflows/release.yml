name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag discipline
        run: ./gradlew --no-daemon verifyReleaseTag

      - name: Build + verify
        run: ./gradlew --no-daemon ci

      - name: Assemble release artifacts
        run: |
          ./gradlew --no-daemon :enkidu-intellij-plugin:buildPlugin
          ls -la enkidu-intellij-plugin/build/distributions || true
          ls -la **/build/libs || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            enkidu-intellij-plugin/build/distributions/*.zip
            **/build/libs/*.jar
            **/build/publications/**/*
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            enkidu-intellij-plugin/build/distributions/*.zip
            **/build/libs/*.jar
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
