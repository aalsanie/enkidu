name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check repository checkout
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          test -f ./gradlew || { echo "::error::Missing ./gradlew in repo root (must be committed)"; exit 1; }
          chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v2

      - name: Verify tag matches Gradle version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(./gradlew --no-daemon -q printVersion)"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "::error::Tag (${TAG}) must match version in Gradle (${VERSION})."
            exit 1
          fi

      - name: Build, test, plugin verification
        run: ./gradlew --no-daemon ci

      - name: Build plugin ZIP
        run: ./gradlew --no-daemon :enkidu-intellij-plugin:buildPlugin

      - name: Build CLI distribution
        run: ./gradlew --no-daemon :enkidu-cli:installDist

      - name: Collect artifacts (fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/collect_release_artifacts.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
