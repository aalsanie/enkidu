name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Java 17 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          set-default: false
          verify-signature: true

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/*.sh

      - name: Verify immutable action pins
        run: python3 .github/scripts/verify-action-pins.py

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag and changelog discipline
        run: ./gradlew --no-daemon --stacktrace verifyReleaseTag

      - name: Run all production gates
        run: ./gradlew --no-daemon --stacktrace ci

      - name: Run controlled linkage scenarios
        run: .github/scripts/verify-pit-project.sh

      - name: Build release artifacts twice and compare checksums
        env:
          PASS_ONE: ${{ runner.temp }}/enkidu-release-pass-1
          PASS_TWO: ${{ runner.temp }}/enkidu-release-pass-2
        run: |
          set -euo pipefail

          version="$(./gradlew --no-daemon --quiet printVersion | tail -n 1 | tr -d '\r')"
          test -n "$version"

          build_release() {
            ./gradlew               --no-daemon               --stacktrace               clean               :enkidu-artifacts:jar               :enkidu-core:jar               :enkidu-export:jar               :enkidu-cli:jar               :enkidu-cli:distZip               :enkidu-cli:distTar               :enkidu-intellij-plugin:buildPlugin
          }

          rm -rf "$PASS_ONE" "$PASS_TWO" build/release

          build_release
          .github/scripts/stage-release-artifacts.sh "$PASS_ONE" "$version"

          build_release
          .github/scripts/stage-release-artifacts.sh "$PASS_TWO" "$version"

          diff -u "$PASS_ONE/SHA256SUMS.txt" "$PASS_TWO/SHA256SUMS.txt"

          mkdir -p build/release
          cp -a "$PASS_TWO/." build/release/

      - name: Verify release build did not modify tracked files
        run: ./gradlew --no-daemon --stacktrace verifyNoWorkingTreeChanges

      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/*

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(./gradlew --no-daemon --quiet printVersion | tail -n 1 | tr -d '\r')"

          gh release create "$GITHUB_REF_NAME"             build/release/*             --verify-tag             --generate-notes             --title "Enkidu $version"
